# Starship config matching psst's default prompt components and layout.
# Used to measure how much of starship's cost is its default config
# vs. its fixed startup overhead.
format = "[\n ](purple)$username $directory $git_commit $git_branch $battery [\n](purple)[ ](purple)"
add_newline = false

[username]
show_always = true
format = "[$user](cyan)"

[directory]
format = "[$path](white)"

[git_branch]
format = "[$branch](red)"

[git_commit]
format = "[\\($hash\\)](red)"

[battery]
format = "[$percentage]($style)"

[[battery.display]]
threshold = 100
