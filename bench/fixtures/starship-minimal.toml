# Minimal starship config, roughly equivalent to psst's default prompt:
# user, path, git commit + branch, battery, newline, prompt char.
# Used to measure how much of starship's cost is its default config
# vs. its fixed startup overhead.
format = "$username$directory$git_branch$git_commit$battery$line_break$character"
add_newline = false

[username]
show_always = true
format = "[$user]($style) "

[directory]
format = "[$path]($style) "

[git_branch]
format = "[$branch]($style) "

[git_commit]
format = "[\\($hash\\)]($style) "

[battery]
format = "[$percentage]($style) "

[[battery.display]]
threshold = 100
